<div class="status-container">
  <h2>Status</h2>

  <div class="info-list">
    <div class="info-item">
      <span class="label">Current Time</span>
      <span class="separator">::</span>
      <span class="value">{{ currentDate }}</span>
    </div>

    <div class="info-item">
      <span class="label">User Agent</span>
      <span class="separator">::</span>
      <span class="value">{{ userAgent }}</span>
    </div>

    <div class="info-item">
      <span class="label">Languages</span>
      <span class="separator">::</span>
      <span class="value">{{ languages }}</span>
    </div>

    <div class="info-item">
      <span class="label">Is Cookie Enabled?</span>
      <span class="separator">::</span>
      <span class="value">{{ cookieEnabled }}</span>
    </div>

    <div class="info-item">
      <span class="label">Logical Processors</span>
      <span class="separator">::</span>
      <span class="value">{{ logicalProcessors }}</span>
    </div>

    <div class="info-item">
      <span class="label">Max Touch Points</span>
      <span class="separator">::</span>
      <span class="value">{{ maxTouchPoints }}</span>
    </div>
  </div>
</div>
